apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: podinfo-dev
resources:
- ../../base
- ingress.yaml
patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "hello from DEV"
  target:
    kind: Deployment
    name: podinfo
