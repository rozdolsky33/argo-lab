apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bluegreen-demo
spec:
  ingressClassName: nginx
  rules:
  - host: bluegreen.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: bluegreen-demo-active, port: {name: http}}
  - host: bluegreen-preview.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: bluegreen-demo-preview, port: {name: http}}
