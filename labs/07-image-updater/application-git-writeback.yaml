# Write-back method "git": the updater commits labs/07-image-updater/app/.argocd-source-image-updater-demo.yaml
# to the repo and Argo CD syncs it. This is the GitOps way. Needs a git credential secret (see README).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: image-updater-demo
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd-image-updater.argoproj.io/image-list: podinfo=ghcr.io/stefanprodan/podinfo
    argocd-image-updater.argoproj.io/podinfo.update-strategy: semver
    argocd-image-updater.argoproj.io/podinfo.allow-tags: regexp:^6\.\d+\.\d+$
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/git-branch: main
    # argocd-image-updater.argoproj.io/git-branch: main:image-updater-{{range .Images}}{{.Name}}-{{.NewTag}}{{end}}  # PR-style branches
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGE_ME/ArgoCD.git
    targetRevision: main
    path: labs/07-image-updater/app
  destination:
    server: https://kubernetes.default.svc
    namespace: image-updater-demo
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
