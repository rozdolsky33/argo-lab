# Retries with backoff, an exit handler that always runs, and workflow-level status in a template.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: retries-
  namespace: argo
spec:
  entrypoint: main
  onExit: cleanup                 # runs whether main succeeded or failed
  templates:
  - name: main
    retryStrategy:
      limit: "3"
      retryPolicy: Always
      backoff: {duration: "5s", factor: "2", maxDuration: "1m"}
    container:
      image: busybox:1.36
      command: [sh, -c]
      # fails ~2 out of 3 times, so you can watch retries in the UI
      args: ["if [ $((RANDOM % 3)) -eq 0 ]; then echo ok; else echo flaky; exit 1; fi"]

  - name: cleanup
    container:
      image: busybox:1.36
      command: [sh, -c]
      args: ["echo 'workflow {{workflow.name}} finished with status {{workflow.status}}'"]
