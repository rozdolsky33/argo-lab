# Parameters: workflow-level inputs with defaults, passed down into templates.
# Override at submit time:  argo submit 02-parameters.yaml -p message="hi there"
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: parameters-
  namespace: argo
spec:
  entrypoint: print
  arguments:
    parameters:
    - name: message
      value: "default message"
  templates:
  - name: print
    inputs:
      parameters:
      - name: message
    container:
      image: busybox:1.36
      command: [sh, -c]
      args: ["echo '{{inputs.parameters.message}}'"]
