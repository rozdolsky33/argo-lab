# Artifacts: files passed between steps through the artifact repository (MinIO in the quick-start).
# Open MinIO (see `make status`) and look in bucket my-bucket after the run.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: artifacts-
  namespace: argo
spec:
  entrypoint: main
  templates:
  - name: main
    steps:
    - - name: produce
        template: produce
    - - name: consume
        template: consume
        arguments:
          artifacts:
          - name: report
            from: "{{steps.produce.outputs.artifacts.report}}"

  - name: produce
    container:
      image: busybox:1.36
      command: [sh, -c]
      args: ["date > /tmp/report.txt; echo 'generated by {{pod.name}}' >> /tmp/report.txt"]
    outputs:
      artifacts:
      - name: report
        path: /tmp/report.txt
        # archive: {none: {}}   # store as plain file instead of .tgz

  - name: consume
    inputs:
      artifacts:
      - name: report
        path: /tmp/input/report.txt
    container:
      image: busybox:1.36
      command: [sh, -c]
      args: ["echo '--- received artifact:'; cat /tmp/input/report.txt"]
