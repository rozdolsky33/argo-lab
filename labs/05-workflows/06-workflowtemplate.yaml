# WorkflowTemplate: reusable, namespaced definition. Submit with:
#   argo submit --from workflowtemplate/build-and-test -p repo=my-repo
# or reference it from another workflow via templateRef.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: build-and-test
  namespace: argo
spec:
  entrypoint: pipeline
  arguments:
    parameters:
    - name: repo
      value: example-repo
  templates:
  - name: pipeline
    inputs: {parameters: [{name: repo}]}
    dag:
      tasks:
      - name: build
        template: shell
        arguments: {parameters: [{name: cmd, value: "echo building {{inputs.parameters.repo}}; sleep 3"}]}
      - name: unit-tests
        dependencies: [build]
        template: shell
        arguments: {parameters: [{name: cmd, value: "echo unit tests; sleep 2"}]}
      - name: lint
        dependencies: [build]
        template: shell
        arguments: {parameters: [{name: cmd, value: "echo lint; sleep 1"}]}
      - name: package
        dependencies: [unit-tests, lint]
        template: shell
        arguments: {parameters: [{name: cmd, value: "echo packaging {{inputs.parameters.repo}}"}]}
  - name: shell
    inputs: {parameters: [{name: cmd}]}
    container:
      image: busybox:1.36
      command: [sh, -c, "{{inputs.parameters.cmd}}"]
---
# ClusterWorkflowTemplate: same idea, cluster-scoped, usable from any namespace.
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: notify
spec:
  templates:
  - name: slack-ish
    inputs: {parameters: [{name: text}]}
    container:
      image: busybox:1.36
      command: [sh, -c, "echo 'NOTIFY: {{inputs.parameters.text}}'"]
