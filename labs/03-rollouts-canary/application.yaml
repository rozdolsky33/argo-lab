apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canary-demo
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGE_ME/ArgoCD.git
    targetRevision: main
    path: labs/03-rollouts-canary/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: canary
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
