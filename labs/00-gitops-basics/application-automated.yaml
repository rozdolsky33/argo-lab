# Lab 00, step 2: the same app with automated sync, pruning and self-heal.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-dev
  namespace: argocd
  # Finalizer = cascade delete: removing the Application also removes its resources.
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGE_ME/ArgoCD.git
    targetRevision: main
    path: labs/apps/podinfo/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo-dev
  syncPolicy:
    automated:
      prune: true       # delete resources removed from git
      selfHeal: true    # revert manual kubectl changes in the cluster
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 3
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
