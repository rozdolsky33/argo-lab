# cert-manager issues a certificate from the lab-ca ClusterIssuer because of the annotation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podinfo
  annotations:
    cert-manager.io/cluster-issuer: lab-ca
spec:
  ingressClassName: nginx
  tls:
  - hosts: [podinfo-tls.localhost]
    secretName: podinfo-tls
  rules:
  - host: podinfo-tls.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: podinfo, port: {name: http}}
