# Notifications are built into Argo CD. Configure services, templates and triggers in this ConfigMap,
# then subscribe an Application with an annotation (see subscribe.sh).
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # --- service: a generic webhook pointing at the echo receiver ---
  service.webhook.echo: |
    url: http://echo.argocd.svc
    headers:
    - name: Content-Type
      value: application/json

  # --- templates: what to send ---
  template.app-sync-succeeded: |
    webhook:
      echo:
        method: POST
        body: |
          {"event":"sync-succeeded","app":"{{.app.metadata.name}}","revision":"{{.app.status.sync.revision}}","health":"{{.app.status.health.status}}"}
  template.app-health-degraded: |
    webhook:
      echo:
        method: POST
        body: |
          {"event":"health-degraded","app":"{{.app.metadata.name}}","health":"{{.app.status.health.status}}"}

  # --- triggers: when to send ---
  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded']
      oncePer: app.status.sync.revision
      send: [app-sync-succeeded]
  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]

  # Default subscription for every app (alternative to per-app annotations)
  # subscriptions: |
  #   - recipients: [echo]
  #     triggers: [on-sync-succeeded, on-health-degraded]
