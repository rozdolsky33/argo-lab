apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-a-podinfo
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: team-a
  source:
    repoURL: https://github.com/CHANGE_ME/ArgoCD.git
    targetRevision: main
    path: labs/apps/podinfo/overlays/dev
    kustomize:
      namespace: team-a-dev            # override the overlay's namespace to satisfy the project
  destination:
    server: https://kubernetes.default.svc
    namespace: team-a-dev
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
