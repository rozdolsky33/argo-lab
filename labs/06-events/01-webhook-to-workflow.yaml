# EventSource (webhook) -> EventBus -> Sensor -> trigger: create an Argo Workflow.
# The classic "CI webhook kicks off a pipeline" pattern.
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: webhook
  namespace: argo-events
spec:
  service:
    ports:
    - port: 12000
      targetPort: 12000
  webhook:
    example:                       # event name; referenced by the Sensor as dependency eventName
      port: "12000"
      endpoint: /example
      method: POST
---
# The Sensor's workflow trigger creates resources in another namespace (argo), so its service
# account needs permission to create Workflows there. A namespaced Role + RoleBinding in "argo"
# is enough; the binding can reference a ServiceAccount from a different namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operate-workflow-sa
  namespace: argo-events
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operate-workflow-role
  namespace: argo
rules:
- apiGroups: [argoproj.io]
  resources: [workflows]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operate-workflow-binding
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: operate-workflow-role
subjects:
- kind: ServiceAccount
  name: operate-workflow-sa
  namespace: argo-events
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: webhook
  namespace: argo-events
spec:
  template:
    serviceAccountName: operate-workflow-sa
  dependencies:
  - name: payload
    eventSourceName: webhook
    eventName: example
  triggers:
  - template:
      name: run-workflow
      k8s:
        operation: create
        source:
          resource:
            apiVersion: argoproj.io/v1alpha1
            kind: Workflow
            metadata:
              generateName: from-webhook-
              namespace: argo
            spec:
              entrypoint: print
              arguments:
                parameters:
                - name: body
                  value: "replaced by parameters below"
              templates:
              - name: print
                inputs:
                  parameters: [{name: body}]
                container:
                  image: busybox:1.36
                  # The body is untrusted input from the network. Hand it to the container via an
                  # env var rather than splicing it into a shell command string, so a crafted
                  # payload like  '; rm -rf /  cannot be executed.
                  env:
                  - name: BODY
                    value: "{{inputs.parameters.body}}"
                  command: [sh, -c]
                  args: ['echo "webhook body:"; echo "$BODY"']
        # Inject fields from the event into the resource before creating it.
        parameters:
        - src:
            dependencyName: payload
            dataKey: body           # the whole JSON body; use body.<field> for a single field
          dest: spec.arguments.parameters.0.value
